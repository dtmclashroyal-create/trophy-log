<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>트로피 기록장</title>
<meta name="theme-color" content="#1f3fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="트로피 기록장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6fb,#0b1022);--card:light-dark(#ffffff,#141b36);--ink:light-dark(#101631,#eef1ff);--mute:light-dark(#5b6386,#9aa3c7);--line:light-dark(#dde2f0,#27305a);--royal:light-dark(#1f3fbf,#1a2f8f);--royal2:light-dark(#16309a,#121f63);--gold:#f5b301;--gold2:#ffd65a;--win:light-dark(#11894a,#3ccf7c);--loss:light-dark(#d4302b,#ff6b63);--chipbg:light-dark(#eef1fa,#1c2448)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.pad{padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.hero{background:linear-gradient(180deg,var(--royal),var(--royal2));color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.titlerow{display:flex;align-items:center;gap:12px}
h1{font:400 clamp(32px,5vw,48px)/1.05 "Black Han Sans",sans-serif;margin:0}
.refresh{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;min-width:40px;min-height:40px;font-size:22px;line-height:1;cursor:pointer}
.refresh.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{margin:6px 0 0;color:#c9d3ff;font-size:15px}
.figs{display:flex;flex-wrap:wrap;gap:10px 28px}
.fig1 .k{font-size:13px;color:#c9d3ff}
.fig1 .v{font:400 28px/1.1 "Black Han Sans",sans-serif;white-space:nowrap}
.fig1 .v.big{font-size:44px;color:var(--gold2)}
.up{color:#7dffb0}.dn{color:#ffb0aa}
.chartbox{margin-top:18px;background:rgba(0,0,0,.18);border-radius:14px;padding:10px 10px 4px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;padding:2px 4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px "Noto Sans KR",sans-serif;background:transparent;color:#dfe5ff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;cursor:pointer;min-height:34px}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a1300}
.fig{position:relative;height:clamp(230px,34vw,340px)}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig svg text{font:13px "Noto Sans KR",sans-serif;fill:#dfe5ff}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#dfe5ff;padding:20px}
.sync{font-size:13px;color:#c9d3ff;margin:8px 4px 0}
.main{padding-block:24px calc(48px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:24px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{font:400 22px/1.2 "Black Han Sans",sans-serif;margin:0 0 14px}
.loghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.wl{font-size:14px;color:var(--mute)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;font-weight:500;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.when{white-space:nowrap;color:var(--mute);font-size:14px}
td.mode{white-space:nowrap;font-size:14px}
td.note{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;white-space:nowrap}
.tag.win{background:var(--win)}.tag.loss{background:var(--loss)}.tag.draw{background:var(--mute)}
.cr{font-size:13px;color:var(--mute);margin-left:4px;white-space:nowrap}
.more{margin-top:10px;width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;font:500 14px "Noto Sans KR",sans-serif}
.deck{padding:12px 0;border-bottom:1px solid var(--line)}
.deck:last-child{border-bottom:0;padding-bottom:0}
.deck:first-child{padding-top:0}
.dtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.drate{font:400 22px "Black Han Sans",sans-serif;white-space:nowrap}
.dmeta{font-size:13px;color:var(--mute);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--loss) 70%,transparent);margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--win)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;max-width:340px}
.cards img,.cards .noimg{width:100%;aspect-ratio:5/6;object-fit:contain;display:block}
.cards .noimg{display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.2;background:var(--chipbg);border-radius:8px;padding:4px;overflow-wrap:anywhere}
.muted{color:var(--mute);font-size:14px;margin:0}
.side{display:grid;gap:24px}
.vs{display:block;font-size:12px;color:var(--mute)}
.musum{font-size:15px;margin:0 0 12px}
.musum b{color:var(--loss)}
.mu{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mu:last-child{border-bottom:0}
.mu img,.mu .noimg{width:40px;aspect-ratio:5/6;object-fit:contain;grid-row:span 2}
.mu .noimg{display:grid;place-items:center;font-size:9px;background:var(--chipbg);border-radius:6px;overflow-wrap:anywhere;text-align:center}
.mu .nm{font-weight:700;font-size:15px;line-height:1.2}
.mu .ct{font-size:13px;color:var(--mute);white-space:nowrap}
.mu .pct{font:400 22px "Black Han Sans",sans-serif;text-align:right;white-space:nowrap;grid-row:span 2}
.mu .bar{margin:2px 0 0}
.mu.few{opacity:.55}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pick{font:500 13px "Noto Sans KR",sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;min-height:36px;cursor:pointer;white-space:nowrap}
.pick[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin:0 0 12px}
.mini img,.mini .noimg{width:100%;aspect-ratio:5/6;object-fit:contain;display:block}
.mini .noimg{display:grid;place-items:center;font-size:8px;background:var(--chipbg);border-radius:4px;overflow-wrap:anywhere;text-align:center}
.deck[data-key]{cursor:pointer}
.pickgrp{display:inline-flex;align-items:stretch}
.pickgrp .pick{border-radius:99px 0 0 99px;border-right:0}
.unpin{border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:0 99px 99px 0;min-width:34px;min-height:36px;font-size:16px;cursor:pointer}
.pickgrp .pick[aria-pressed=true]+.unpin{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick.add{border-style:dashed;color:var(--mute)}
.picker{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;display:grid;gap:12px;background:var(--bg)}
.prow{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0;padding-bottom:0}
.prow .mini{margin:0}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.pin{font:500 13px "Noto Sans KR",sans-serif;border:1px solid var(--gold);background:var(--gold);color:#1a1300;border-radius:99px;padding:6px 14px;min-height:36px;cursor:pointer;white-space:nowrap}
.pin.on{background:transparent;color:var(--mute);border-color:var(--line)}
.deck .use{font-size:12px;color:var(--mute);margin-top:6px}
.foot{font-size:12px;color:var(--mute);margin:12px 0 0;line-height:1.5}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.side{order:-1}}
@media(max-width:600px){table{font-size:14px}th,td{padding:7px 4px}.fig1 .v.big{font-size:38px}.hide-sm{display:none}}
</style>
</head>
<body>
<header class="hero pad">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="titlerow"><h1>트로피 기록장</h1><button class="refresh" id="refresh" aria-label="새로고침">↻</button></div>
        <p class="sub" id="who">불러오는 중…</p>
      </div>
      <div class="figs" id="figs"></div>
    </div>
    <div class="chartbox">
      <div class="chiprow">
        <div class="chips" id="series"></div>
        <div class="chips" id="chips">
          <button class="chip" data-d="1" aria-pressed="false">오늘</button>
          <button class="chip" data-d="7" aria-pressed="false">7일</button>
          <button class="chip" data-d="30" aria-pressed="false">30일</button>
          <button class="chip" data-d="0" aria-pressed="true">전체</button>
        </div>
      </div>
      <div class="fig" id="fig"><svg id="svg" aria-label="점수 변화 그래프"></svg><div class="empty" id="empty" hidden></div></div>
    </div>
    <p class="sync" id="sync"></p>
  </div>
</header>

<main class="main pad">
  <div class="wrap grid">
    <section class="card">
      <div class="loghead"><h2>경기 기록</h2><span class="wl" id="wl"></span></div>
      <div class="scroll">
        <table>
          <thead><tr><th>시간</th><th>모드</th><th class="n">점수</th><th class="n">변화</th><th>결과</th><th class="hide-sm">덱</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <button class="more" id="more" type="button" hidden>더 보기</button>
    </section>
    <div class="side">
      <section class="card">
        <h2>상대 윈컨별 승률</h2>
        <div class="picks" id="picks"></div>
        <div class="picker" id="picker" hidden></div>
        <div class="mini" id="mini" hidden></div>
        <p class="musum" id="musum"></p>
        <div id="mu"><p class="muted">상대 덱이 담긴 경기가 쌓이면 어떤 윈컨에 약한지 보여 줘요.</p></div>
        <p class="foot">덱을 추가해서 고르면 그 덱으로 한 경기만 따져요. 추정 승률은 판 수가 적을수록 평균 승률(덱을 고르면 그 덱의 평균) 쪽으로 당겨서 계산해요. 경기가 쌓일수록 실제 승률에 가까워지고, 흐리게 보이는 줄은 아직 5판이 안 된 상대예요. 한 덱에 윈컨이 둘이면 둘 다에 반영돼요.</p>
      </section>
      <section class="card">
        <h2>덱별 성적</h2>
        <div id="decks"><p class="muted">기록이 쌓이면 덱마다 승률이 나와요.</p></div>
      </section>
    </div>
  </div>
</main>

<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));
const DAY = 864e5;
// Win conditions, most defining first (used to name an opponent deck's main threat).
const WINCONS = [['Golem','골렘'],['Lava Hound','라바 하운드'],['Electro Giant','일렉트로 자이언트'],['Elixir Golem','엘릭서 골렘'],['Giant','자이언트'],['Royal Giant','로얄 자이언트'],['Goblin Giant','자이언트 고블린'],['Minion Giant','미니언 자이언트'],['Rune Giant','룬 자이언트'],['Goblinstein','고블린슈타인'],['Hog Rider','호그 라이더'],['Royal Hogs','로얄 호그'],['Ram Rider','램 라이더'],['Battle Ram','배틀 램'],['X-Bow','대형 석궁'],['Mortar','박격포'],['Balloon','해골 비행선'],['Graveyard','무덤'],['Three Musketeers','삼총사'],['Goblin Drill','고블린 드릴'],['Mega Knight','메가 나이트'],['P.E.K.K.A','P.E.K.K.A'],['Sparky','스파키'],['Giant Skeleton','자이언트 해골'],['Miner','광부'],['Goblin Barrel','고블린 통'],['Skeleton Barrel','해골 통'],['Wall Breakers','해골 돌격병'],['Suspicious Bush','수상한 수풀']];
const WC_FALLBACK = Object.fromEntries(WINCONS);
let KO = {};
const ko = n => KO[n] || WC_FALLBACK[n] || n;
const mainWincon = deck => (WINCONS.find(([n])=>deck?.includes(n))||[])[0];
const MODES = {pathOfLegend:'랭크전',PvP:'트로피전',competitiveDuel:'경쟁 대결',riverRacePvP:'강 레이스',riverRaceDuel:'강 레이스 듀얼',boatBattle:'보트 전투',clanMate:'클랜 친선',friendly:'친선전',challenge:'챌린지',tournament:'토너먼트'};
const SERIES = {ranked:'랭크 점수',ladder:'트로피'};
let muDeck = '';
let all = [], profile = null, cards = {}, series = null, range = 0, shown = 30;

async function load(){
  $('refresh').classList.add('spin');
  try{
    const r = await fetch('data/battles.json?ts=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(!Object.keys(KO).length) try{ KO = await (await fetch('data/cards_ko.json?ts=' + Date.now(), {cache:'no-store'})).json() }catch{}
    all = (d.battles || []).slice().sort((a,b)=>a.t-b.t);
    profile = d.profile; cards = d.cards || {}; render();
  }catch(e){
    $('sync').textContent = '기록을 불러오지 못했어요. 인터넷 연결을 확인하고 ↻를 눌러 주세요.';
  }finally{ $('refresh').classList.remove('spin') }
}

function points(kind){
  const type = kind==='ranked' ? 'pathOfLegend' : 'PvP';
  const p = all.filter(b=>b.type===type&&typeof b.start==='number'&&typeof b.change==='number').map(b=>({t:b.t,v:b.start+b.change,r:b.result,s:b.start}));
  if(p.length) p.unshift({t:p[0].t-1,v:p[0].s});
  return p;
}

function renderSeries(){
  const avail = Object.keys(SERIES).filter(k=>points(k).length);
  if(!series||!avail.includes(series)) series = avail[0]||null;
  $('series').innerHTML = avail.length>1 ? avail.map(k=>`<button class="chip" data-s="${k}" aria-pressed="${k===series}">${SERIES[k]}</button>`).join('') : '';
}

function renderFigs(pts){
  if(!pts.length){$('figs').innerHTML='';return}
  const last = pts[pts.length-1];
  const cur = series==='ranked'&&profile?.ranked!=null ? profile.ranked : series==='ladder'&&profile?.trophies!=null ? profile.trophies : last.v;
  const peak = Math.max(...pts.map(p=>p.v));
  const at = ms=>{const ref=[...pts].reverse().find(p=>p.t<=Date.now()-ms);return ref?ref.v:pts[0].v};
  const today = new Date(); today.setHours(0,0,0,0);
  const before = [...pts].reverse().find(p=>p.t<today.getTime());
  const dToday = cur-(before?before.v:pts[0].v), d7 = cur-at(7*DAY);
  const f = (k,v,cls='')=>`<div class="fig1"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  const c = n=>n>0?'up':n<0?'dn':'';
  let html = f('현재 '+SERIES[series],fmt(cur),'big')+f('기록 중 최고',fmt(peak))+f('오늘',sign(dToday),c(dToday))+f('7일',sign(d7),c(d7));
  // The API repeats last season's final rank in the current season when the player is unranked.
  if(series==='ranked'){
    const last=profile?.lastSeason?.rank, now=profile?.rank;
    if(now&&now!==last) html += f('순위',fmt(now)+'위');
    else html += f('순위','언랭') + (last?f('지난 시즌',fmt(last)+'위'):'');
  }
  $('figs').innerHTML = html;
}

function draw(){
  const s=$('svg'),box=$('fig'),W=box.clientWidth,H=box.clientHeight;
  let pts = series ? points(series) : [];
  if(range&&pts.length){const cut=Date.now()-range*DAY;const prev=[...pts].reverse().find(p=>p.t<cut);pts=pts.filter(p=>p.t>=cut);if(prev)pts.unshift({...prev,t:cut,r:null})}
  if(pts.length<2){s.innerHTML='';$('empty').hidden=false;$('empty').textContent=series?'이 기간엔 그래프를 그릴 기록이 부족해요.':'경기 기록이 들어오면 여기에 그래프가 그려져요.';return}
  $('empty').hidden=true;
  const m={l:48,r:70,t:28,b:28};
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  const span=Math.max(hi-lo,60),stepRaw=span/4,p10=10**Math.floor(Math.log10(stepRaw)),step=[1,2,5,10].map(k=>k*p10).find(k=>k>=stepRaw);
  lo=Math.floor((lo-span*.15)/step)*step;hi=Math.ceil((hi+span*.1)/step)*step;
  const n=pts.length,x=i=>m.l+i/(n-1)*(W-m.l-m.r),y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b);
  let d=`M${x(0)},${y(pts[0].v)}`;
  pts.slice(1).forEach((p,i)=>{d+=`H${x(i+1)}V${y(p.v)}`});
  const area=d+`V${H-m.b}H${x(0)}Z`;
  let grid='';for(let v=lo;v<=hi;v+=step){grid+=`<line x1="${m.l}" x2="${W-m.r+8}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.12)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  const dt=new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric'});
  const k=W<520?2:4;let xt='';for(let j=0;j<=k;j++){const i=Math.round((n-1)*j/k);xt+=`<text x="${x(i)}" y="${H-8}" text-anchor="${j==0?'start':j==k?'end':'middle'}">${dt.format(pts[i].t)}</text>`}
  const dots=n<=150?pts.map((p,i)=>p.r==='win'||p.r==='loss'?`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.2" fill="${p.r=='win'?'#7dffb0':'#ff8f88'}"/>`:'').join(''):'';
  const L=pts[n-1],lx=x(n-1),ly=y(L.v);
  s.innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd65a" stop-opacity=".85"/><stop offset="1" stop-color="#f5b301" stop-opacity=".15"/></linearGradient></defs>
  ${grid}<path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="#ffd65a" stroke-width="2.5" stroke-linejoin="round"/>${dots}
  <circle cx="${lx}" cy="${ly}" r="6" fill="#ffd65a" stroke="#16309a" stroke-width="2"/>
  <text x="${lx+10}" y="${ly+5}" style="font:400 18px 'Black Han Sans',sans-serif;fill:#fff">${fmt(L.v)}</text>${xt}`;
}
const ro=new ResizeObserver(draw);ro.observe($('fig'));

function renderRows(){
  const rows=all.slice().reverse();
  const tf=new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  if(!rows.length){$('rows').innerHTML=`<tr><td colspan="6" style="text-align:center;color:var(--mute);padding:28px 8px">아직 기록이 없어요.</td></tr>`;$('more').hidden=true;return}
  const tag=r=>r==='win'?'<span class="tag win">승</span>':r==='loss'?'<span class="tag loss">패</span>':'<span class="tag draw">무</span>';
  const dc=d=>d>0?'style="color:var(--win)"':d<0?'style="color:var(--loss)"':'';
  $('rows').innerHTML=rows.slice(0,shown).map(b=>{
    const ok=typeof b.start==='number'&&typeof b.change==='number'&&b.start>20;
    return `<tr><td class="when">${esc(tf.format(b.t))}</td><td class="mode">${esc(MODES[b.type]||b.type||'기타')}${mainWincon(b.oppDeck)?`<span class="vs">vs ${esc(ko(mainWincon(b.oppDeck)))}</span>`:''}</td><td class="n"><b>${ok?fmt(b.start+b.change):''}</b></td><td class="n" ${ok?dc(b.change):''}>${ok?sign(b.change):''}</td><td>${tag(b.result)}<span class="cr">${esc(b.crowns)}–${esc(b.oppCrowns)}</span></td><td class="note hide-sm">${esc((b.deck||[]).map(ko).join(', '))}</td></tr>`;
  }).join('');
  $('more').hidden=rows.length<=shown;
}

function renderDecks(){
  const map=new Map();
  all.filter(b=>b.deck?.length===8).forEach(b=>{
    const key=b.deck.join('|');const g=map.get(key)||{deck:b.deck,evo:[],hero:[],w:0,l:0,net:0,last:0};
    if(b.result==='win')g.w++;else if(b.result==='loss')g.l++;
    if(b.type==='pathOfLegend'&&typeof b.change==='number')g.net+=b.change;
    if(b.t>=g.last){g.last=b.t;g.evo=b.evo||[];g.hero=b.hero||[]}
    map.set(key,g);
  });
  const list=[...map.values()].filter(g=>g.w+g.l).sort((a,b)=>(b.w+b.l)-(a.w+a.l)||b.last-a.last).slice(0,6);
  if(!list.length)return;
  $('decks').innerHTML=list.map(g=>{const n=g.w+g.l,r=Math.round(g.w/n*100);
    // evolution cards first, then heroes, like the in-game deck
    const slot=n=>g.evo.includes(n)?0:g.hero.includes(n)?1:2;
    const order=[...g.deck].sort((a,b)=>slot(a)-slot(b));
    return `<div class="deck" data-key="${esc(g.deck.join('|'))}"><div class="dtop"><span class="drate">${r}%</span><span class="dmeta">${g.w}승 ${g.l}패${g.net?` · 랭크 ${sign(g.net)}`:''}</span></div><div class="bar"><i style="width:${r}%"></i></div><div class="cards">${order.map(name=>cardImg(name,['evo','hero','icon'][slot(name)])).join('')}</div><div class="use">눌러서 이 덱을 윈컨별 승률에 추가하고 보기</div></div>`}).join('');
}
const PIN_KEY='trophy-log-pinned';
let pinned=(()=>{try{return JSON.parse(localStorage.getItem(PIN_KEY)||'[]')}catch{return []}})();
let pickerOpen=false;
function savePins(){try{localStorage.setItem(PIN_KEY,JSON.stringify(pinned))}catch{}}
function myDecks(bs){
  const m=new Map();
  bs.forEach(b=>{const k=b.deck.join('|');const g=m.get(k)||{key:k,deck:b.deck,evo:[],hero:[],games:0,first:b.t,last:0};g.games++;g.first=Math.min(g.first,b.t);if(b.t>=g.last){g.last=b.t;g.evo=b.evo||[];g.hero=b.hero||[]}m.set(k,g)});
  // name each deck after its win condition; number duplicates in the order first played so names stay put
  const seen={};[...m.values()].sort((a,b)=>a.first-b.first).forEach(d=>{const base=(mainWincon(d.deck)?ko(mainWincon(d.deck)):'기타')+' 덱';seen[base]=(seen[base]||0)+1;d.label=base+(seen[base]>1?' '+seen[base]:'')});
  return [...m.values()].sort((a,b)=>b.games-a.games||b.last-a.last);
}
const deckSlot=d=>n=>d.evo.includes(n)?0:d.hero.includes(n)?1:2;
const deckCards=d=>{const slot=deckSlot(d);return [...d.deck].sort((a,b)=>slot(a)-slot(b)).map(n=>cardImg(n,['evo','hero','icon'][slot(n)])).join('')};
function renderMatchups(){
  const allBs=all.filter(b=>b.oppDeck?.length===8&&b.deck?.length===8&&(b.result==='win'||b.result==='loss'));
  if(!allBs.length)return;
  const decks=myDecks(allBs), byKey=new Map(decks.map(d=>[d.key,d]));
  const mine=pinned.map(k=>byKey.get(k)).filter(Boolean);
  if(muDeck&&!mine.some(d=>d.key===muDeck))muDeck='';
  $('picks').innerHTML=`<button class="pick" data-k="" aria-pressed="${!muDeck}">내 덱 전체 · ${allBs.length}판</button>`
    +mine.map(d=>`<span class="pickgrp"><button class="pick" data-k="${esc(d.key)}" aria-pressed="${d.key===muDeck}">${esc(d.label)} · ${d.games}판</button><button class="unpin" data-k="${esc(d.key)}" aria-label="${esc(d.label)} 빼기">×</button></span>`).join('')
    +`<button class="pick add" id="addDeck" aria-expanded="${pickerOpen}">${pickerOpen?'닫기':'+ 덱 추가'}</button>`;
  $('picker').hidden=!pickerOpen;
  if(pickerOpen)$('picker').innerHTML=`<p class="muted">보고 싶은 덱만 추가하세요. 이 핸드폰에 저장돼요.</p>`+decks.map(d=>{const on=pinned.includes(d.key);
    return `<div class="prow"><div class="mini">${deckCards(d)}</div><div class="pmeta"><span><b>${esc(d.label)}</b> · ${d.games}판</span><button class="pin${on?' on':''}" data-k="${esc(d.key)}">${on?'추가됨':'추가'}</button></div></div>`}).join('');
  const sel=byKey.get(muDeck);
  $('mini').hidden=!sel;
  if(sel)$('mini').innerHTML=deckCards(sel);
  const bs=sel?allBs.filter(b=>b.deck.join('|')===muDeck):allBs;
  const W=bs.filter(b=>b.result==='win').length, p0=W/bs.length, K=5;
  const tally=new Map();
  bs.forEach(b=>WINCONS.forEach(([n])=>{if(!b.oppDeck.includes(n))return;const g=tally.get(n)||{n,w:0,l:0};b.result==='win'?g.w++:g.l++;tally.set(n,g)}));
  // Bayesian (beta-prior) estimate: small samples are pulled toward the overall win rate
  const rows=[...tally.values()].map(g=>({...g,games:g.w+g.l,est:(g.w+K*p0)/(g.w+g.l+K)})).sort((a,b)=>a.est-b.est||b.games-a.games);
  const weak=rows.find(r=>r.games>=5&&r.est<p0-0.03);
  $('musum').innerHTML=weak?`가장 약한 상대는 <b>${esc(ko(weak.n))}</b>예요. 추정 승률 ${Math.round(weak.est*100)}% (${weak.games}판, ${sel?'이 덱':'내'} 평균 ${Math.round(p0*100)}%)`:`아직 확실히 약하다고 할 만한 상대는 없어요. ${sel?'이 덱 승률':'내 평균 승률'} ${Math.round(p0*100)}% · ${bs.length}판`;
  $('mu').innerHTML=rows.slice(0,12).map(r=>{const e=Math.round(r.est*100),raw=Math.round(r.w/r.games*100);
    return `<div class="mu${r.games<5?' few':''}">${cardImg(r.n,'icon')}<div><div class="nm">${esc(ko(r.n))}</div><div class="ct">${r.w}승 ${r.l}패 · 실제 ${raw}%</div></div><div class="pct" style="color:${r.est<p0-0.03?'var(--loss)':r.est>p0+0.03?'var(--win)':'inherit'}">${e}%</div><div class="bar" style="grid-column:2"><i style="width:${e}%"></i></div></div>`}).join('');
}
function pin(k){if(!pinned.includes(k)){pinned.push(k);savePins()}}
function unpin(k){pinned=pinned.filter(x=>x!==k);savePins();if(muDeck===k)muDeck=''}
$('picks').addEventListener('click',e=>{
  const x=e.target.closest('.unpin');if(x){unpin(x.dataset.k);renderMatchups();return}
  if(e.target.closest('#addDeck')){pickerOpen=!pickerOpen;renderMatchups();return}
  const b=e.target.closest('.pick');if(!b)return;muDeck=b.dataset.k;renderMatchups();
});
$('picker').addEventListener('click',e=>{const b=e.target.closest('.pin');if(!b)return;const k=b.dataset.k;pinned.includes(k)?unpin(k):pin(k);renderMatchups()});
$('decks').addEventListener('click',e=>{const d=e.target.closest('.deck[data-key]');if(!d)return;pin(d.dataset.key);muDeck=d.dataset.key;pickerOpen=false;renderMatchups();$('picks').closest('section').scrollIntoView({behavior:'smooth',block:'start'})});
['mini','mu','picker'].forEach(id=>$(id).addEventListener('error',e=>{const i=e.target;if(i.tagName!=='IMG')return;const s=document.createElement('span');s.className='noimg';s.textContent=i.alt;i.replaceWith(s)},true));
function cardImg(name,kind){
  const c=cards[name]||{},src=c[kind]||c.icon;
  if(!src||!/^https:\/\//.test(src))return `<span class="noimg">${esc(ko(name))}</span>`;
  return `<img src="${esc(src)}" alt="${esc(ko(name))}" title="${esc(ko(name))}" loading="lazy" decoding="async">`;
}
// if an image can't load, show the card name instead
$('decks').addEventListener('error',e=>{const i=e.target;if(i.tagName!=='IMG')return;const s=document.createElement('span');s.className='noimg';s.textContent=i.alt;i.replaceWith(s)},true);

function renderSync(){
  if(!profile){$('who').textContent='';$('sync').textContent='';return}
  $('who').textContent=`${profile.name||''} ${profile.tag||''} · 트로피 ${fmt(profile.trophies)}`;
  const mins=Math.round((Date.now()-profile.updatedAt)/6e4);
  const ago=mins<1?'방금':mins<60?mins+'분 전':mins<1440?Math.round(mins/60)+'시간 전':Math.round(mins/1440)+'일 전';
  const bs=profile.bestSeason;
  $('sync').textContent=`약 5분마다 자동 기록 · 마지막 변화 ${ago}`+(bs?.trophies?` · 역대 시즌 최고 ${fmt(bs.trophies)}점`+(bs.rank?` (${fmt(bs.rank)}위)`:''):'');
}

function render(){
  renderSeries();
  const pts=series?points(series):[];
  renderFigs(pts);renderRows();renderMatchups();renderDecks();renderSync();draw();
  const w=all.filter(b=>b.result==='win').length,l=all.filter(b=>b.result==='loss').length;
  $('wl').textContent=w+l?`${w}승 ${l}패 · 승률 ${Math.round(w/(w+l)*100)}%`:'';
}

$('series').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;series=b.dataset.s;render()});
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;range=+b.dataset.d;$('chips').querySelectorAll('button').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));draw()});
$('more').addEventListener('click',()=>{shown+=30;renderRows()});
$('refresh').addEventListener('click',load);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});

load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
