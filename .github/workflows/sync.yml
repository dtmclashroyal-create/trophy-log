name: 배틀 기록 동기화

on:
  # 5분마다 cron-job.org가 workflow_dispatch로 실행해요 (GitHub 자체 예약은 자주 늦어서).
  # 아래 schedule은 cron-job.org가 멈췄을 때를 위한 예비용이에요.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}       # cron-job.org, 또는 Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 배틀 로그 가져오기
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          CR_TAG: ${{ vars.CR_TAG || '222PVQCR8' }}
        run: python scripts/sync.py
      - name: 바뀐 기록 저장
        run: |
          if git diff --quiet data/battles.json; then exit 0; fi
          git config user.name "trophy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/battles.json
          git commit -m "기록 동기화"
          git pull --rebase origin main   # 그 사이 다른 커밋이 올라왔어도 밀리지 않게
          git push
