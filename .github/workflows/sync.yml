name: 배틀 기록 동기화

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분 늦을 수 있어요)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 배틀 로그 가져오기
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          CR_TAG: ${{ vars.CR_TAG || '222PVQCR8' }}
        run: python scripts/sync.py
      - name: 바뀐 기록 저장
        run: |
          if git diff --quiet data/battles.json; then exit 0; fi
          git config user.name "trophy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/battles.json
          git commit -m "기록 동기화"
          git push
